name: build-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TagPrintStudio.sln

      - name: Build
        run: dotnet build TagPrintStudio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TagPrintStudio.Tests/TagPrintStudio.Tests.csproj --configuration Release --no-build
