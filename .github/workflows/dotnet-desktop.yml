name: build-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TagPrintStudio.sln --locked-mode -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:UseAppHost=true

      - name: Package vulnerability scan
        run: dotnet list TagPrintStudio.sln package --include-transitive --vulnerable

      - name: Build
        run: dotnet build TagPrintStudio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TagPrintStudio.Tests/TagPrintStudio.Tests.csproj --configuration Release --no-build

      - name: Publish self-contained Windows x64 executable
        run: dotnet publish TagPrintStudio.csproj --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:UseAppHost=true --no-restore
